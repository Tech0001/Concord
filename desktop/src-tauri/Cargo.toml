[package]
name = "concord-next"
version = "0.4.0"
description = "A local research archive for spoken-word media"
authors = ["Concord contributors"]
license = "MIT"
edition = "2021"
default-run = "concord-next"

[lib]
name = "concord_core"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2.4"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
directories = "6"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
url = "2"
libc = "0.2"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
